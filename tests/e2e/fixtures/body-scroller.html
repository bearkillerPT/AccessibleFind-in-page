<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Body scroller</title>
  <!-- A common app layout: the window never scrolls, <body> does. -->
  <style>
    html { height: 100%; overflow: hidden; }
    body { height: 100%; margin: 0; overflow: auto; }
  </style>
</head>
<body>
  <p>top of the page</p>
  <div style="height: 4000px"></div>
  <p id="bottom">bottom quokka</p>
</body>
</html>
