<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Light page with dark parts</title></head>
<body style="margin: 0; background: #fafafa; color: #1f2328; font: 18px/1.6 system-ui, sans-serif">
  <!-- A dark picture behind white text: no background color anywhere up the tree. -->
  <header id="hero" style="padding: 3rem 1.5rem; color: #fff; background-image: linear-gradient(135deg, #0d1b2a, #1b263b)">
    <h1>Harbour needle</h1>
  </header>
  <main style="max-width: 40rem; margin: 0 auto; padding: 2rem 1.5rem">
    <p id="light">An ordinary paragraph with a needle in it.</p>
    <pre id="code" style="background: #1e1e1e; color: #d4d4d4; padding: 1rem">const needle = find(haystack);</pre>
  </main>
</body>
</html>
